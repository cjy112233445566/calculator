<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .calculator {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        
        .display {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: right;
        }
        
        .display input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 2.5rem;
            text-align: right;
            outline: none;
            color: #333;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .btn {
            padding: 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        
        .btn.number {
            background: #f1f3f4;
            color: #333;
        }
        
        .btn.number:hover {
            background: #e0e0e0;
        }
        
        .btn.operator {
            background: #667eea;
            color: white;
        }
        
        .btn.operator:hover {
            background: #5a6fd6;
        }
        
        .btn.clear {
            background: #ff6b6b;
            color: white;
        }
        
        .btn.clear:hover {
            background: #ee5a5a;
        }
        
        .btn.equal {
            background: #20bf6b;
            color: white;
            grid-column: span 2;
        }
        
        .btn.equal:hover {
            background: #1ba35a;
        }
        
        .btn.function {
            background: #a29bfe;
            color: white;
        }
        
        .btn.function:hover {
            background: #918af5;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <input type="text" id="result" readonly>
        </div>
        <div class="buttons">
            <button class="btn clear" onclick="clearDisplay()">C</button>
            <button class="btn function" onclick="appendToDisplay('%')">%</button>
            <button class="btn function" onclick="appendToDisplay('/')">/</button>
            <button class="btn operator" onclick="appendToDisplay('*')">×</button>
            
            <button class="btn number" onclick="appendToDisplay('7')">7</button>
            <button class="btn number" onclick="appendToDisplay('8')">8</button>
            <button class="btn number" onclick="appendToDisplay('9')">9</button>
            <button class="btn operator" onclick="appendToDisplay('-')">−</button>
            
            <button class="btn number" onclick="appendToDisplay('4')">4</button>
            <button class="btn number" onclick="appendToDisplay('5')">5</button>
            <button class="btn number" onclick="appendToDisplay('6')">6</button>
            <button class="btn operator" onclick="appendToDisplay('+')">+</button>
            
            <button class="btn number" onclick="appendToDisplay('1')">1</button>
            <button class="btn number" onclick="appendToDisplay('2')">2</button>
            <button class="btn number" onclick="appendToDisplay('3')">3</button>
            
            <button class="btn number" onclick="appendToDisplay('0')">0</button>
            <button class="btn number" onclick="appendToDisplay('.')">.</button>
            <button class="btn equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const result = document.getElementById('result');

        function appendToDisplay(value) {
            if (value === '×') {
                result.value += '*';
            } else if (value === '−') {
                result.value += '-';
            } else {
                result.value += value;
            }
        }

        function clearDisplay() {
            result.value = '';
        }

        function calculate() {
            try {
                let expression = result.value;
                expression = expression.replace(/%/g, '/100');
                const answer = eval(expression);
                result.value = answer;
            } catch (error) {
                result.value = '错误';
            }
        }
    </script>
</body>
</html>
