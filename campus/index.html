<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园智能助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .tab-btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background: white;
            color: #667eea;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
        
        .content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        
        .nav-link {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .nav-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            border: 1px solid #667eea;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        
        .nav-link a:hover {
            background: #667eea;
            color: white;
        }
        
        .schedule-container {
            overflow-x: auto;
        }
        
        .week-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .day-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .day-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }
        
        .day-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .schedule-grid {
            display: grid;
            grid-template-columns: 80px repeat(6, 1fr);
            gap: 5px;
        }
        
        .grid-header {
            background: #f5f5f5;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            border-radius: 8px;
        }
        
        .grid-cell {
            background: #fff3e0;
            padding: 10px;
            border-radius: 8px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .grid-cell.empty {
            background: #fafafa;
        }
        
        .course-item {
            text-align: center;
            font-size: 0.85rem;
        }
        
        .course-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        
        .course-room {
            font-size: 0.75rem;
            color: #666;
        }
        
        .meal-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .meal-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .meal-btn.breakfast {
            background: #ffeaa7;
            color: #d63031;
        }
        
        .meal-btn.lunch {
            background: #fab1a0;
            color: #e17055;
        }
        
        .meal-btn.dinner {
            background: #a29bfe;
            color: #6c5ce7;
        }
        
        .meal-btn.active {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .menu-card {
            background: linear-gradient(145deg, #f8f9fa, #e9ecef);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .menu-card:hover {
            transform: translateY(-5px);
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }
        
        .menu-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #333;
        }
        
        .menu-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #667eea;
        }
        
        .menu-category {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }
        
        .total-section {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            text-align: right;
        }
        
        .total-label {
            font-size: 1.1rem;
            color: #666;
        }
        
        .total-price {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }
        
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            
            .schedule-grid {
                grid-template-columns: 60px repeat(6, 1fr);
            }
            
            .grid-cell {
                min-height: 60px;
            }
            
            .menu-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-link">
            <a href="../index.html">🏠 返回首页</a>
        </div>
        <header>
            <h1>🏫 校园智能助手</h1>
            <p>课表查询 · 食堂菜单 · 校园服务</p>
        </header>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('schedule')">📅 课程表</button>
            <button class="tab-btn" onclick="showTab('cafeteria')">🍽️ 食堂菜单</button>
        </div>
        
        <div class="content" id="schedule-content">
            <h2 style="color: #333; margin-bottom: 20px;">本周课程表</h2>
            <div class="week-nav">
                <button class="day-btn active" onclick="loadSchedule('Monday')">周一</button>
                <button class="day-btn" onclick="loadSchedule('Tuesday')">周二</button>
                <button class="day-btn" onclick="loadSchedule('Wednesday')">周三</button>
                <button class="day-btn" onclick="loadSchedule('Thursday')">周四</button>
                <button class="day-btn" onclick="loadSchedule('Friday')">周五</button>
            </div>
            <div class="schedule-container">
                <div class="schedule-grid" id="schedule-grid">
                    <div class="grid-header"></div>
                    <div class="grid-header">第1节</div>
                    <div class="grid-header">第2节</div>
                    <div class="grid-header">第3节</div>
                    <div class="grid-header">第4节</div>
                    <div class="grid-header">第5节</div>
                    <div class="grid-header">第6节</div>
                    <div class="grid-header">课程</div>
                    <div id="period-1" class="grid-cell empty"></div>
                    <div id="period-2" class="grid-cell empty"></div>
                    <div id="period-3" class="grid-cell empty"></div>
                    <div id="period-4" class="grid-cell empty"></div>
                    <div id="period-5" class="grid-cell empty"></div>
                    <div id="period-6" class="grid-cell empty"></div>
                </div>
            </div>
        </div>
        
        <div class="content" id="cafeteria-content" style="display: none;">
            <h2 style="color: #333; margin-bottom: 20px;">今日菜单</h2>
            <div class="meal-tabs">
                <button class="meal-btn breakfast active" onclick="loadMenu('breakfast')">🌅 早餐</button>
                <button class="meal-btn lunch" onclick="loadMenu('lunch')">☀️ 午餐</button>
                <button class="meal-btn dinner" onclick="loadMenu('dinner')">🌙 晚餐</button>
            </div>
            <div class="menu-grid" id="menu-grid"></div>
            <div class="total-section">
                <div class="total-label">菜单总数：</div>
                <div class="total-price" id="menu-count">0</div>
            </div>
        </div>
    </div>

    <script>
        const SCHEDULE_DATA = {
            "Monday": [
                {"period": 1, "course": "高等数学", "classroom": "教学楼A-301"},
                {"period": 2, "course": "大学英语", "classroom": "教学楼B-205"},
                {"period": 4, "course": "计算机基础", "classroom": "实验楼C-102"},
                {"period": 5, "course": "体育", "classroom": "体育馆"}
            ],
            "Tuesday": [
                {"period": 1, "course": "数据结构", "classroom": "教学楼A-401"},
                {"period": 2, "course": "物理实验", "classroom": "实验楼D-201"},
                {"period": 3, "course": "物理实验", "classroom": "实验楼D-201"},
                {"period": 5, "course": "形势与政策", "classroom": "教学楼B-101"}
            ],
            "Wednesday": [
                {"period": 2, "course": "概率论", "classroom": "教学楼A-203"},
                {"period": 3, "course": "程序设计", "classroom": "实验楼C-201"},
                {"period": 4, "course": "程序设计", "classroom": "实验楼C-201"},
                {"period": 6, "course": "音乐鉴赏", "classroom": "艺术楼-105"}
            ],
            "Thursday": [
                {"period": 1, "course": "高等数学", "classroom": "教学楼A-301"},
                {"period": 2, "course": "大学英语", "classroom": "教学楼B-205"},
                {"period": 4, "course": "数据库原理", "classroom": "实验楼C-302"},
                {"period": 5, "course": "数据库原理", "classroom": "实验楼C-302"}
            ],
            "Friday": [
                {"period": 1, "course": "数据结构", "classroom": "教学楼A-401"},
                {"period": 3, "course": "创新创业", "classroom": "教学楼B-301"},
                {"period": 4, "course": "军事理论", "classroom": "教学楼A-101"}
            ]
        };

        const CAFETERIA_DATA = {
            "breakfast": [
                {"name": "豆浆", "price": 2.0, "category": "饮品"},
                {"name": "油条", "price": 1.5, "category": "主食"},
                {"name": "包子", "price": 1.0, "category": "主食"},
                {"name": "鸡蛋", "price": 1.0, "category": "蛋类"},
                {"name": "小米粥", "price": 1.5, "category": "粥类"},
                {"name": "咸菜", "price": 0.5, "category": "小菜"}
            ],
            "lunch": [
                {"name": "红烧肉", "price": 12.0, "category": "荤菜"},
                {"name": "宫保鸡丁", "price": 10.0, "category": "荤菜"},
                {"name": "清蒸鱼", "price": 15.0, "category": "荤菜"},
                {"name": "蒜蓉青菜", "price": 5.0, "category": "素菜"},
                {"name": "麻婆豆腐", "price": 6.0, "category": "素菜"},
                {"name": "西红柿炒蛋", "price": 7.0, "category": "素菜"},
                {"name": "米饭", "price": 1.0, "category": "主食"},
                {"name": "紫菜蛋花汤", "price": 3.0, "category": "汤类"}
            ],
            "dinner": [
                {"name": "麻辣烫", "price": 10.0, "category": "特色"},
                {"name": "拉面", "price": 8.0, "category": "主食"},
                {"name": "炒饭", "price": 7.0, "category": "主食"},
                {"name": "炒面", "price": 7.0, "category": "主食"},
                {"name": "酸辣土豆丝", "price": 5.0, "category": "素菜"},
                {"name": "凉拌黄瓜", "price": 4.0, "category": "凉菜"},
                {"name": "冬瓜排骨汤", "price": 8.0, "category": "汤类"}
            ]
        };

        function showTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-btn[onclick="showTab('${tabName}')"]`).classList.add('active');
            
            document.getElementById('schedule-content').style.display = tabName === 'schedule' ? 'block' : 'none';
            document.getElementById('cafeteria-content').style.display = tabName === 'cafeteria' ? 'block' : 'none';
        }

        function loadSchedule(day) {
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.day-btn[onclick="loadSchedule('${day}')"]`).classList.add('active');
            
            for (let i = 1; i <= 6; i++) {
                document.getElementById(`period-${i}`).innerHTML = '';
                document.getElementById(`period-${i}`).className = 'grid-cell empty';
            }
            
            const schedule = SCHEDULE_DATA[day] || [];
            schedule.forEach(item => {
                const cell = document.getElementById(`period-${item.period}`);
                cell.innerHTML = `
                    <div class="course-item">
                        <div class="course-name">${item.course}</div>
                        <div class="course-room">${item.classroom}</div>
                    </div>
                `;
                cell.className = 'grid-cell';
            });
        }

        function loadMenu(meal) {
            document.querySelectorAll('.meal-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.meal-btn.${meal}`).classList.add('active');
            
            const menu = CAFETERIA_DATA[meal] || [];
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = menu.map(item => `
                <div class="menu-card">
                    <div class="menu-name">${item.name}</div>
                    <div class="menu-price">¥${item.price.toFixed(2)}</div>
                    <div class="menu-category">${item.category}</div>
                </div>
            `).join('');
            
            document.getElementById('menu-count').textContent = menu.length;
        }

        loadSchedule('Monday');
        loadMenu('breakfast');
    </script>
</body>
</html>
